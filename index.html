<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industry Internship Test</title>
<style>
  :root{
    --maroon:#8f1b1b;
    --maroon-dark:#6e1414;
    --navy:#1c2b4a;
    --gold:#c9a227;
    --cream:#fbf7ee;
    --paper:#ffffff;
    --ink:#242424;
    --muted:#6b6b6b;
    --line:#e7e0d2;
    --good:#1e7d46;
    --bad:#b3261e;
    --blue:#1d6fd8;
    --radius:10px;
    --shadow:0 2px 10px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Noto Sans Devanagari",Arial,sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
  }
  .banner-wrap{
    background:#fff;
    border-bottom:4px solid var(--maroon);
    padding:14px 16px 10px;
  }
  .header-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    max-width:900px;
    margin:0 auto;
    flex-wrap:wrap;
  }
  .header-row img.logo{
    width:72px;
    height:72px;
    object-fit:contain;
    flex-shrink:0;
  }
  .side-group{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .header-row img.portrait{
    width:72px;
    height:72px;
    object-fit:cover;
    border-radius:8px;
    border:2px solid var(--gold);
    flex-shrink:0;
  }
  .header-text{
    text-align:center;
  }
  .header-text .org-line{
    font-size:14px;
    color:var(--navy);
    font-weight:700;
    margin-bottom:2px;
  }
  .header-text .college-name{
    font-size:24px;
    font-weight:800;
    color:var(--maroon);
    line-height:1.25;
  }
  @media(max-width:560px){
    .header-row{gap:10px;}
    .header-row img.logo, .header-row img.portrait{width:48px; height:48px;}
    .header-text .college-name{font-size:17px;}
    .header-text .org-line{font-size:11.5px;}
  }
  .strip{
    background:var(--navy);
    color:#fff;
    text-align:center;
    font-size:14px;
    letter-spacing:.4px;
    padding:7px 10px;
    font-weight:600;
  }
  .wrap{
    max-width:1020px;
    margin:0 auto;
    padding:18px 16px 60px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:18px;
  }
  h1,h2,h3{margin:0 0 10px; color:var(--navy);}
  h2{font-size:19px; border-left:5px solid var(--maroon); padding-left:10px;}
  .lead{
    text-align:center;
    font-size:22px;
    font-weight:700;
    color:var(--maroon-dark);
    margin:4px 0 4px;
  }
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px;}
  .role-row{display:flex; gap:14px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
  .role-btn{
    flex:1 1 220px;
    max-width:280px;
    padding:20px;
    background:var(--paper);
    border:2px solid var(--line);
    border-radius:var(--radius);
    cursor:pointer;
    text-align:center;
    transition:.15s;
    font-weight:700;
    color:var(--navy);
  }
  .role-btn:hover{border-color:var(--maroon); box-shadow:var(--shadow); transform:translateY(-2px);}
  .role-btn .emoji{font-size:30px; display:block; margin-bottom:6px;}
  label{display:block; font-size:13px; font-weight:600; color:var(--navy); margin:12px 0 4px;}
  input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=date],select,textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid #cfc7b3;
    border-radius:7px;
    font-size:14px;
    background:#fffdf9;
    color:var(--ink);
    font-family:inherit;
  }
  textarea{min-height:110px; font-family:monospace; font-size:12.5px;}
  input.autofilled{background:#fdf9ec; border-color:var(--gold); color:#5b4a10;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  @media(max-width:600px){.row2{grid-template-columns:1fr;}}
  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    font-weight:700;
    font-size:14.5px;
    padding:11px 18px;
    font-family:inherit;
  }
  .btn-primary{background:var(--maroon); color:#fff;}
  .btn-primary:hover{background:var(--maroon-dark);}
  .btn-gold{background:var(--gold); color:#3a2c00;}
  .btn-navy{background:var(--navy); color:#fff;}
  .btn-outline{background:#fff; border:1.5px solid var(--navy); color:var(--navy);}
  .btn-danger{background:var(--bad); color:#fff;}
  .btn-sm{padding:6px 12px; font-size:12.5px; border-radius:6px;}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .btnbar{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .msg{padding:10px 14px; border-radius:8px; font-size:13.5px; margin:10px 0;}
  .msg.ok{background:#e8f4ec; color:var(--good); border:1px solid #b9dfc6;}
  .msg.err{background:#fbe9e7; color:var(--bad); border:1px solid #f0c4bf;}
  .msg.info{background:#eef1f8; color:var(--navy); border:1px solid #cdd6ea;}
  .tabbar{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--line);}
  .tabbar button{
    background:none; color:var(--muted); padding:9px 14px; border-radius:0;
    border-bottom:3px solid transparent; font-size:13.5px;
  }
  .tabbar button.active{color:var(--maroon-dark); border-bottom-color:var(--maroon);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{border:1px solid var(--line); padding:7px 8px; text-align:left;}
  th{background:var(--cream); color:var(--navy);}
  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; background:var(--navy); color:#fff;}
  .pill.red{background:var(--bad);}
  .pill.green{background:var(--good);}
  .hidden{display:none !important;}
  .top-info{
    display:flex; flex-wrap:wrap; gap:10px 20px; font-size:13px; color:var(--navy);
    background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:14px;
  }
  .top-info b{color:var(--maroon-dark);}
  .timer{
    position:sticky; top:0; z-index:5;
    background:var(--navy); color:#fff; text-align:center;
    font-size:16px; font-weight:700; padding:8px; border-radius:8px; margin-bottom:14px;
    letter-spacing:.5px;
  }
  .timer.warn{background:var(--bad); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
  .qcounter{text-align:center; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .progressbar{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:18px;}
  .progressbar-fill{height:100%; background:var(--gold);}
  .domain-tag{
    display:inline-block; background:var(--navy); color:#fff; font-size:11.5px; padding:3px 10px;
    border-radius:20px; margin-bottom:10px; letter-spacing:.3px;
  }
  .qtext{font-size:17px; font-weight:700; color:var(--ink); margin-bottom:16px; line-height:1.5;}
  .exam-layout{display:flex; gap:16px; align-items:flex-start;}
  .exam-main{flex:1; min-width:0;}
  .qnav-panel{width:230px; flex-shrink:0; position:sticky; top:52px;}
  .qnav-legend{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--muted); margin-bottom:14px;}
  .qnav-legend span{display:flex; align-items:center; gap:8px;}
  .qnav-legend .dot{width:12px; height:12px; border-radius:3px; display:inline-block; flex-shrink:0;}
  .qnav-legend .dot.green{background:var(--good);}
  .qnav-legend .dot.red{background:var(--bad);}
  .qnav-legend .dot.blue{background:var(--blue);}
  .qnav-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:7px;}
  .qnav-box{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:6px; font-size:12.5px; font-weight:700; color:#fff; cursor:pointer;
    transition:.12s; border:2px solid transparent;
  }
  .qnav-box:hover{transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,0.15);}
  .qnav-box.attempted{background:var(--good);}
  .qnav-box.notattempted{background:var(--bad);}
  .qnav-box.current{background:var(--blue); border-color:#0d3d75;}
  @media(max-width:760px){
    .exam-layout{flex-direction:column;}
    .qnav-panel{width:100%; position:static; order:2;}
    .qnav-grid{grid-template-columns:repeat(8,1fr);}
  }
  .opt{
    display:flex; align-items:flex-start; gap:10px;
    border:1.5px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px;
    cursor:pointer; transition:.12s; font-size:14.5px;
  }
  .opt:hover{border-color:var(--gold); background:#fffaf0;}
  .opt.sel{border-color:var(--maroon); background:#fdf1ef; font-weight:600;}
  .opt .let{font-weight:800; color:var(--navy); min-width:18px;}
  .result-box{text-align:center; padding:10px 0;}
  .score-big{font-size:44px; font-weight:800; color:var(--maroon-dark);}
  .score-of{font-size:16px; color:var(--muted); margin-bottom:8px;}
  .qlist-item{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13.5px;}
  .qlist-item .meta{color:var(--muted); font-size:12px; margin-top:4px;}
  .flexbetween{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .small{font-size:12.5px; color:var(--muted);}
  footer{text-align:center; font-size:12px; color:var(--muted); padding:20px 0 10px;}
  .loader{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; padding:6px 0;}
  .spin{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--maroon); border-radius:50%; animation:sp 0.7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwhzUIutrNPvizsVx7QRK6-cjSkQx9qtsVU2-6-mKmDMoxgrGcMhzeVCGCTtGqn5pVE/exec';

// admin Settings tab), which lets you change/reconnect the sheet without
// editing this file directly. The link is what "remembers" it — reopening
// this file with no link falls back to DEFAULT_API_URL above.
function getApiUrlFromQuery(){
  try{
    const p = new URLSearchParams(window.location.search).get('api');
    return p ? decodeURIComponent(p) : null;
  }catch(e){ return null; }
}
let ACTIVE_API_URL = getApiUrlFromQuery() || DEFAULT_API_URL;

const K_QUESTIONS = 'questions';

/* ---------- Google Sheet API helpers ---------- */
function isApiConfigured(){
  return ACTIVE_API_URL && !ACTIVE_API_URL.includes('PASTE_YOUR');
}
async function apiGet(action, params){
  const qs = new URLSearchParams(Object.assign({action}, params||{})).toString();
  const res = await fetch(ACTIVE_API_URL + '?' + qs, {method:'GET'});
  if(!res.ok) throw new Error('Sheet API GET failed: ' + res.status);
  const data = await res.json();
  if(data && data.error) throw new Error(data.error);
  return data;
}
async function apiPost(action, data){
  const res = await fetch(ACTIVE_API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // keeps this a "simple request" so Apps Script doesn't need to handle CORS preflight
    body: JSON.stringify({action, data})
  });
  if(!res.ok) throw new Error('Sheet API POST failed: ' + res.status);
  const out = await res.json();
  if(out && out.error) throw new Error(out.error);
  return out;
}

async function loadAll(){
  // single round-trip instead of four separate requests — cuts connection time noticeably
  const all = await apiGet('all');
  CONFIG = Object.assign({}, DEFAULT_CONFIG, (all && all.config) || {});
  QUESTIONS = (all && Array.isArray(all.questions)) ? all.questions : [];
  ROSTER = (all && Array.isArray(all.roster)) ? all.roster : [];
  NOTICES = (all && Array.isArray(all.notices)) ? all.notices : [];
}
async function getJSON(key, fallback){
  try{
    if(key===K_CONFIG){
      const r = await apiGet('config');
      return (r && Object.keys(r).length) ? r : fallback;
    }
    if(key===K_QUESTIONS){
      const r = await apiGet('questions');
      return Array.isArray(r) ? r : fallback;
    }
    if(key===K_ROSTER){
      const r = await apiGet('roster');
      return Array.isArray(r) ? r : fallback;
    }
    if(key===K_NOTICES){
      const r = await apiGet('notices');
      return Array.isArray(r) ? r : fallback;
    }
    return fallback;
  }catch(e){ console.error('getJSON failed', key, e); return fallback; }
}
async function setJSON(key, val){
  try{
    if(key===K_CONFIG){ await apiPost('saveConfig', val); return true; }
    if(key===K_QUESTIONS){ await apiPost('saveQuestions', val); return true; }
    if(key===K_ROSTER){ await apiPost('saveRoster', val); return true; }
    if(key===K_NOTICES){ await apiPost('saveNotices', val); return true; }
    return false;
  }catch(e){ console.error('setJSON failed', key, e); return false; }
}
async function fetchResult(roll, enrolment){
  try{
    const r = await apiGet('result', {roll, enrolment});
    return (r && r.found) ? r.result : null;
  }catch(e){ console.error('fetchResult failed', e); return null; }
}
async function saveResult(resultObj){
  try{
    const r = await apiPost('addResult', resultObj);
    return r && r.ok;
  }catch(e){ console.error('saveResult failed', e); return false; }
}
async function fetchAllResults(){
  try{
    const r = await apiGet('results');
    return Array.isArray(r) ? r : [];
  }catch(e){ console.error('fetchAllResults failed', e); return []; }
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDT(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString();
}

/* =========================================================
   STUDENT FLOW
========================================================= */
function renderStudentLogin(){
  const now = new Date();
  let windowMsg = '';
  if(CONFIG.startAt){
    const s = new Date(CONFIG.startAt);
    if(now < s) windowMsg = `<div class="msg info">This test opens on <b>${fmtDT(CONFIG.startAt)}</b>. Please come back then.</div>`;
  }
  if(!windowMsg && CONFIG.endAt){
    const e = new Date(CONFIG.endAt);
    if(now > e) windowMsg = `<div class="msg err">This test window closed on <b>${fmtDT(CONFIG.endAt)}</b>.</div>`;
  }
  app.innerHTML = `
    <div class="card">
      <h2>Student Login</h2>
      ${windowMsg}
      <label>Roll No.</label>
      <input type="text" id="sRoll" placeholder="Enter your roll number" autofocus>
      <div id="rollHint"></div>
      <label>Full Name</label>
      <input type="text" id="sName" placeholder="As per college record">
      <div class="row2">
        <div>
          <label>Enrolment No.</label>
          <input type="text" id="sEnrol" placeholder="e.g. 2400123456">
        </div>
        <div>
          <label>Class</label>
          <input type="text" id="sClass" placeholder="e.g. TY-CO">
        </div>
      </div>
      <div id="loginMsg"></div>
      <div class="btnbar">
        <button class="btn-primary" id="startBtn">Start Test</button>
        <button class="btn-outline" id="backBtn">Back</button>
      </div>
    </div>
  `;
  const nameEl = document.getElementById('sName');
  const enrolEl = document.getElementById('sEnrol');
  const classEl = document.getElementById('sClass');
  document.getElementById('sRoll').addEventListener('input', (e)=>{
    const roll = e.target.value.trim();
    const hint = document.getElementById('rollHint');
    const found = roll ? ROSTER.find(r=> String(r.roll).trim() === roll) : null;
    if(found){
      nameEl.value = found.name || '';
      enrolEl.value = found.enrolment || '';
      classEl.value = found.cls || '';
      [nameEl, enrolEl, classEl].forEach(el=>{ el.readOnly = true; el.classList.add('autofilled'); });
      hint.innerHTML = '<div class="msg ok">✓ Details auto-filled from registered records.</div>';
    } else {
      [nameEl, enrolEl, classEl].forEach(el=>{ el.readOnly = false; el.classList.remove('autofilled'); });
      hint.innerHTML = (roll && ROSTER.length) ? '<div class="msg info">No registered record found for this roll — please fill in the details manually.</div>' : '';
    }
  });
  document.getElementById('backBtn').onclick = goHome;
  document.getElementById('startBtn').onclick = async ()=>{
    const name = document.getElementById('sName').value.trim();
    const roll = document.getElementById('sRoll').value.trim();
    const enrol = document.getElementById('sEnrol').value.trim();
    const cls = document.getElementById('sClass').value.trim();
    const msgBox = document.getElementById('loginMsg');
    if(!name || !roll || !enrol){
      msgBox.innerHTML = '<div class="msg err">Please fill in Name, Roll No. and Enrolment No.</div>';
      return;
    }
    const now = new Date();
    if(CONFIG.startAt && now < new Date(CONFIG.startAt)){
      msgBox.innerHTML = `<div class="msg err">Test has not started yet. Opens: ${fmtDT(CONFIG.startAt)}</div>`;
      return;
    }
    if(CONFIG.endAt && now > new Date(CONFIG.endAt)){
      msgBox.innerHTML = `<div class="msg err">Test window has closed.</div>`;
      return;
    }
    if(CONFIG.restrictRoster && ROSTER.length){
      const found = ROSTER.find(r=> String(r.roll).trim()===roll && String(r.enrolment).trim()===enrol);
      if(!found){
        msgBox.innerHTML = '<div class="msg err">Roll No. / Enrolment No. not found in the registered student list. Contact admin.</div>';
        return;
      }
    }
    if(QUESTIONS.length===0){
      msgBox.innerHTML = '<div class="msg err">No questions have been uploaded yet. Please contact the admin.</div>';
      return;
    }
    // check existing result
    msgBox.innerHTML = '<div class="loader"><span class="spin"></span>Checking previous attempts…</div>';
    const existing = await fetchResult(roll, enrol);
    if(existing){
      STUDENT = {roll,name,enrolment:enrol,cls};
      renderResult(existing, true);
      return;
    }
    STUDENT = {roll,name,enrolment:enrol,cls};
    if(CONFIG.testCode){
      renderTestCodeGate();
    } else {
      beginExam();
    }
  };
}

/* ---- Shared exam-start logic (used with or without a test code gate) ---- */
function beginExam(){
  ANSWERS = new Array(QUESTIONS.length).fill(undefined);
  CUR_Q = 0;
  TAB_SWITCHES = 0;
  EXAM_ACTIVE = true;
  renderQuestion();
  startTimer(CONFIG.timeMin);
}

        <button class="btn-primary" id="gateSubmitBtn">Begin Test</button>

function startTimer(mins){
  SECS_LEFT = Math.max(1, parseInt(mins||20,10))*60;
  if(TIMER_HANDLE) clearInterval(TIMER_HANDLE);
  updateTimerDisplay();
  TIMER_HANDLE = setInterval(()=>{
    SECS_LEFT--;
    updateTimerDisplay();
    if(SECS_LEFT<=0){
      clearInterval(TIMER_HANDLE);
      alert('Time is up! Submitting your test now.');
      finishSubmit();
    }
  },1000);
}
function updateTimerDisplay(){
  const el = document.getElementById('clock');
  if(!el) return;
  const m = Math.floor(SECS_LEFT/60), s = SECS_LEFT%60;
  el.textContent = '⏱ Time left: ' + m + ':' + String(s).padStart(2,'0');
  el.classList.toggle('warn', SECS_LEFT<=60);
}

function renderQuestion(){
  const q = QUESTIONS[CUR_Q];
  const total = QUESTIONS.length;
  const pct = Math.round((CUR_Q)/total*100);
  const isLast = CUR_Q === total-1;
  app.innerHTML = `
    <div class="timer" id="clock">⏱ Time left: --:--</div>
    <div class="exam-layout">
      <div class="card exam-main">
        <div class="top-info">
          <span><b>Name:</b> ${esc(STUDENT.name)}</span>
          <span><b>Roll:</b> ${esc(STUDENT.roll)}</span>
          <span><b>Enrolment:</b> ${esc(STUDENT.enrolment)}</span>
          <span><b>Class:</b> ${esc(STUDENT.cls||'-')}</span>
        </div>
        <div class="qcounter">Question ${CUR_Q+1} of ${total}</div>
        <div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>
        ${q.domain? `<div class="domain-tag">${esc(q.domain)}</div>`:''}
        <div class="qtext">Q${CUR_Q+1}. ${esc(q.text)}</div>
        <div id="optsWrap"></div>
        <div id="qMsg"></div>
        <div class="btnbar">
          <button class="btn-outline" id="prevBtn" ${CUR_Q===0?'disabled':''}>&larr; Previous</button>
          <button class="btn-primary" id="nextBtn">${isLast? 'Submit Test' : 'Next Question →'}</button>
        </div>
      </div>
      <div class="card qnav-panel">
        <h3 style="margin-bottom:10px">Questions</h3>
        <div class="qnav-legend">
          <span><i class="dot green"></i>Attempted</span>
          <span><i class="dot red"></i>Not attempted</span>
          <span><i class="dot blue"></i>In progress</span>
        </div>
        <div class="qnav-grid" id="qnavGrid"></div>
      </div>
    </div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  const letters = ['A','B','C','D'];
  q.options.forEach((opt,oi)=>{
    const div = document.createElement('div');
    div.className = 'opt' + (ANSWERS[CUR_Q]===oi ? ' sel':'');
    div.innerHTML = `<span class="let">${letters[oi]})</span><span>${esc(opt)}</span>`;
    div.onclick = ()=>{ ANSWERS[CUR_Q]=oi; renderQuestion(); };
    optsWrap.appendChild(div);
  });
  const navGrid = document.getElementById('qnavGrid');
  QUESTIONS.forEach((qq,i)=>{
    const box = document.createElement('div');
    let cls = 'qnav-box ';
    if(i === CUR_Q) cls += 'current';
    else if(ANSWERS[i] !== undefined) cls += 'attempted';
    else cls += 'notattempted';
    box.className = cls;
    box.textContent = i+1;
    box.title = 'Go to Question ' + (i+1);
    box.onclick = ()=>{ CUR_Q = i; renderQuestion(); };
    navGrid.appendChild(box);
  });
  updateTimerDisplay();
  document.getElementById('prevBtn').onclick = ()=>{ if(CUR_Q>0){ CUR_Q--; renderQuestion(); } };
  document.getElementById('nextBtn').onclick = ()=>{
    if(ANSWERS[CUR_Q]===undefined){
      document.getElementById('qMsg').innerHTML = '<div class="msg err">Please select an option, or use Previous to skip for now.</div>';
      return;
    }
    if(isLast){ confirmSubmit(); }
    else{ CUR_Q++; renderQuestion(); }
  };
}

function confirmSubmit(){
  const unanswered = ANSWERS.map((a,i)=>a===undefined?i+1:null).filter(x=>x);
  if(unanswered.length){
    if(!confirm('You have not answered Q'+unanswered.join(', Q')+'. Submit anyway?')) return;
  } else {
    if(!confirm('Submit the test now? You cannot change answers after this.')) return;
  }
  finishSubmit();
}

async function finishSubmit(){
  EXAM_ACTIVE = false; // stop counting/alerting on tab switches once the test is being submitted
  if(TIMER_HANDLE) clearInterval(TIMER_HANDLE);
  app.innerHTML = `<div class="card"><div class="loader"><span class="spin"></span>Submitting your answers…</div></div>`;
  let score = 0;
  const marksCorrect = Number(CONFIG.marksCorrect)||2;
  const marksWrong = Number(CONFIG.marksWrong)||1;
  QUESTIONS.forEach((q,i)=>{
    if(ANSWERS[i]!==undefined){
      if(ANSWERS[i]===q.correct) score += marksCorrect;
      else score -= marksWrong; // wrong answer — negative marking. Unanswered questions are not penalized.
    }
  });
  const outOf = QUESTIONS.length*marksCorrect;
  const percent = outOf? Math.round(score/outOf*100) : 0;
  const result = {
    roll: STUDENT.roll, name: STUDENT.name, enrolment: STUDENT.enrolment, cls: STUDENT.cls,
    score, outOf, percent, submittedAt: new Date().toISOString(), answers: ANSWERS,
    tabSwitches: TAB_SWITCHES
  };
  const ok = await saveResult(result);
  if(!ok){
    app.innerHTML = `<div class="card"><div class="msg err">Could not save your result to the sheet. Please check your connection and try submitting again.</div>
      <div class="btnbar"><button class="btn-primary" id="retrySubmitBtn">Try Again</button></div></div>`;
    document.getElementById('retrySubmitBtn').onclick = finishSubmit;
    return;
  }
  renderResult(result, false);
}

function renderResult(r, alreadyDone){
  app.innerHTML = `
    <div class="card">
      <h2>${alreadyDone? 'You have already submitted this test' : 'Test Submitted Successfully'}</h2>
      <div class="result-box">
        <div class="score-big">${r.score} / ${r.outOf}</div>
        <div class="score-of">Percentage</div>

/* ---- PDF result generation (jsPDF, runs entirely in the browser) ---- */
function generateResultPDF(r){
  if(!window.jspdf){ alert('PDF library did not load. Check your internet connection and try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const maroon = [143,27,27];

  // Letterhead — reuse the logo/portrait already rendered in the page header
  const logoImg = document.querySelector('.header-row img.logo');
  const portraitImg = document.querySelector('.header-row img.portrait');
  try{ if(portraitImg) doc.addImage(portraitImg.src, 'PNG', 42, 28, 48, 48); }catch(e){}
  try{ if(logoImg) doc.addImage(logoImg.src, 'PNG', pageWidth-90, 28, 48, 48); }catch(e){}

  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.setTextColor(...maroon);
  doc.text('Dr. Panjabrao Deshmukh Polytechnic, Amravati', pageWidth/2, 48, {align:'center'});
  doc.setFontSize(10);
  doc.setFont('helvetica','normal');
  doc.setTextColor(30,30,30);
  doc.text('Computer Engineering Department', pageWidth/2, 66, {align:'center'});

  doc.setDrawColor(...maroon);
  doc.setLineWidth(1.2);
  doc.line(42, 90, pageWidth-42, 90);

  let y = 125;
  doc.setFontSize(16);
  doc.setFont('helvetica','bold');
  doc.setTextColor(20,30,60);
  doc.text('Industry Internship Test — Result', pageWidth/2, y, {align:'center'});
  y += 45;

  const rows = [
    ['Name', r.name],
    ['Roll No.', r.roll],
    ['Enrolment No.', r.enrolment],
    ['Class', r.cls || '-'],
    ['Submitted On', fmtDT(r.submittedAt)]
  ];
  doc.setFontSize(11);
  rows.forEach(([label,val])=>{
    doc.setFont('helvetica','bold');
    doc.setTextColor(20,30,60);
    doc.text(label + ':', 70, y);
    doc.setFont('helvetica','normal');
    doc.setTextColor(30,30,30);
    doc.text(String(val==null?'-':val), 230, y);
    y += 24;
  });

  y += 30;
  doc.setFontSize(30);
  doc.setFont('helvetica','bold');
  doc.setTextColor(...maroon);
  doc.text(r.score + ' / ' + r.outOf, pageWidth/2, y, {align:'center'});
  y += 24;
  doc.setFontSize(13);
  doc.setTextColor(30,30,30);
  doc.text(r.percent + '%  ' + (r.percent>=60? '(Pass)':'(Needs Improvement)'), pageWidth/2, y, {align:'center'});

  y += 60;
  doc.setDrawColor(210,210,210);
  doc.setLineWidth(0.7);
  doc.line(42, y, pageWidth-42, y);
  y += 20;
  doc.setFontSize(9);
  doc.setTextColor(120,120,120);
  doc.setFont('helvetica','normal');
  doc.text('This is a system-generated result sheet from the Industry Internship Test portal.', pageWidth/2, y, {align:'center'});

  doc.save(`Result_${r.roll}_${r.enrolment}.pdf`);
}

function toLocalInput(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function fromLocalInput(v){
  if(!v) return '';
  const d = new Date(v);
  return isNaN(d) ? '' : d.toISOString();
}

/* ---- CSV helpers (bulk question import) ---- */
function parseCSVText(text){
  // returns array of rows, each row an array of trimmed string fields.
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.map(r=>r.map(f=>f.trim())).filter(r=> r.some(f=>f!==''));
}
function importCSVRows(rawText){
  const rows = parseCSVText(rawText);
  let added = 0, skipped = 0;
  rows.forEach(cols=>{
    if(cols.length < 7){ skipped++; return; }
    const [domain, qtext, a, b, c, d, corrRaw] = cols;
    // skip header row
    if(/^question$/i.test(qtext) || /^domain$/i.test(domain)){ return; }
    const letter = (corrRaw||'').toUpperCase().trim().charAt(0);
    const correct = {A:0,B:1,C:2,D:3}[letter];
    if(!qtext || !a || !b || !c || !d || correct===undefined){ skipped++; return; }
    QUESTIONS.push({id:'q'+Date.now()+Math.floor(Math.random()*100000), domain, text:qtext, options:[a,b,c,d], correct});
    added++;
  });
  return {added, skipped};
}
function downloadTemplate(){
  const rows = [
    ['Domain','Question','OptionA','OptionB','OptionC','OptionD','CorrectAnswer'],
    ['Aptitude','What is 15% of 200?','20','30','25','35','B'],
    ['Communication','Which word is closest in meaning to "Punctual"?','Late','On time','Careless','Slow','B'],
    ['Technical','Which of these is a programming language?','HTML','CSS','Python','HTTP','C']
  ];
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'question_bulk_import_template.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    listEl.innerHTML = '<p class="small">No notices yet.</p>';
  } else {
    listEl.innerHTML = NOTICES.map((n,i)=>`
      <div class="qlist-item">
        <div class="flexbetween">
          <div>${esc(n)}</div>
          <button class="btn-danger btn-sm" data-delnotice="${i}">Delete</button>
        </div>
      </div>
    `).join('');
    listEl.querySelectorAll('[data-delnotice]').forEach(btn=>{
      btn.onclick = async ()=>{
        NOTICES.splice(Number(btn.dataset.delnotice), 1);
        await setJSON(K_NOTICES, NOTICES);
        renderTabNotices(body);
      };
    });
  }
}

/* ---- Students (roster) tab ---- */
function renderTabStudents(body){
  body.innerHTML = `
    <label style="display:flex;align-items:center;gap:8px;font-weight:600;">
      <input type="checkbox" id="restrictChk" ${CONFIG.restrictRoster? 'checked':''} style="width:auto;">
      Restrict test to students on the registered list below
    </label>
    <hr style="margin:16px 0;border:none;border-top:1px solid var(--line)">
    <h3>Registered Students (optional roster)</h3>
    <p class="small">Paste one student per line: <code>Roll, Name, Enrolment, Class</code></p>
    <textarea id="rosterText" placeholder="24, Rahul Sharma, 2400123456, TY-CO"></textarea>
    <div id="rosterMsg"></div>
    <div class="btnbar">
      <button class="btn-primary" id="importRosterBtn">Import / Replace List</button>
      ${ROSTER.length? '<button class="btn-danger" id="clearRosterBtn">Clear List</button>' : ''}
    </div>
    <h3 style="margin-top:20px">Current List (${ROSTER.length})</h3>
    <div id="rosterList" style="max-height:280px;overflow:auto;">
      ${ROSTER.length? `<table><tr><th>Roll</th><th>Name</th><th>Enrolment</th><th>Class</th></tr>${
        ROSTER.map(r=>`<tr><td>${esc(r.roll)}</td><td>${esc(r.name)}</td><td>${esc(r.enrolment)}</td><td>${esc(r.cls)}</td></tr>`).join('')
      }</table>` : '<p class="small">No roster uploaded — test is currently open to anyone who enters their details.</p>'}
    </div>
  `;
  document.getElementById('restrictChk').onchange = async (e)=>{
    CONFIG.restrictRoster = e.target.checked;
    await setJSON(K_CONFIG, CONFIG);
  };
  document.getElementById('importRosterBtn').onclick = async ()=>{
    const raw = document.getElementById('rosterText').value.trim();
    const msg = document.getElementById('rosterMsg');
    if(!raw){ msg.innerHTML = '<div class="msg err">Paste at least one row.</div>'; return; }
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    const list = [];
    lines.forEach(line=>{
      const parts = line.split(',').map(p=>p.trim());
      if(parts.length<3) return;
      list.push({roll:parts[0], name:parts[1], enrolment:parts[2], cls:parts[3]||''});
    });
    ROSTER = list;
    await setJSON(K_ROSTER, ROSTER);
    msg.innerHTML = `<div class="msg ok">Imported ${list.length} student(s).</div>`;
    renderTabStudents(body);
  };
  document.getElementById('clearRosterBtn') && (document.getElementById('clearRosterBtn').onclick = async ()=>{
    if(!confirm('Clear the entire roster?')) return;
    ROSTER = [];
    await setJSON(K_ROSTER, ROSTER);
    renderTabStudents(body);
  });
}

/* ---- Results tab ---- */
let RESULTS_SORT_MODE = 'switches'; // 'switches' (default, decreasing) or 'time'
async function renderTabResults(body){
  body.innerHTML = `<div class="loader"><span class="spin"></span>Loading results…</div>`;
  const results = await fetchAllResults();
  sortResults(results);
  window.__resultsCache = results;
  body.innerHTML = `
    <div class="flexbetween">
      <h3>Submissions (${results.length})</h3>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        ${results.length? '<button class="btn-navy btn-sm" id="classPdfBtn">⬇ Download Class PDF</button>':''}
        ${results.length? '<button class="btn-gold btn-sm" id="exportBtn">Export CSV</button>':''}
      </div>
    </div>
    ${results.length? `
    <div class="btnbar" style="margin-top:0">
      <button class="btn-sm ${RESULTS_SORT_MODE==='switches'?'btn-navy':'btn-outline'}" id="sortSwitchesBtn">Sort by Tab Switches ⬇</button>
      <button class="btn-sm ${RESULTS_SORT_MODE==='time'?'btn-navy':'btn-outline'}" id="sortTimeBtn">Sort by Time</button>
    </div>
    <div style="overflow:auto"><table>
      <tr><th>Roll</th><th>Name</th><th>Enrolment</th><th>Class</th><th>Score</th><th>%</th><th>Switches</th><th>Submitted</th><th>PDF</th></tr>
      ${results.map((r,i)=>`<tr>
        <td>${esc(r.roll)}</td><td>${esc(r.name)}</td><td>${esc(r.enrolment)}</td><td>${esc(r.cls||'')}</td>
        <td>${r.score}/${r.outOf}</td><td><span class="pill ${r.percent>=60?'green':'red'}">${r.percent}%</span></td>
        <td><span class="pill ${r.tabSwitches>0?'red':'green'}">${r.tabSwitches||0}</span></td>
        <td>${fmtDT(r.submittedAt)}</td>
        <td><button class="btn-outline btn-sm" data-pdfrow="${i}">PDF</button></td>
      </tr>`).join('')}
    </table></div>` : '<p class="small">No submissions yet.</p>'}
  `;
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = ()=>exportCSV(results);
  const classPdfBtn = document.getElementById('classPdfBtn');
  if(classPdfBtn) classPdfBtn.onclick = ()=> generateClassPDF(results);
  const sortSwitchesBtn = document.getElementById('sortSwitchesBtn');
  if(sortSwitchesBtn) sortSwitchesBtn.onclick = ()=>{ RESULTS_SORT_MODE='switches'; renderTabResults(body); };
  const sortTimeBtn = document.getElementById('sortTimeBtn');
  if(sortTimeBtn) sortTimeBtn.onclick = ()=>{ RESULTS_SORT_MODE='time'; renderTabResults(body); };
  body.querySelectorAll('[data-pdfrow]').forEach(btn=>{
    btn.onclick = ()=> generateResultPDF(results[Number(btn.dataset.pdfrow)]);
  });
}
function sortResults(results){
  if(RESULTS_SORT_MODE === 'switches'){
    results.sort((a,b)=> (b.tabSwitches||0)-(a.tabSwitches||0) || (new Date(b.submittedAt)-new Date(a.submittedAt)));
  } else {
    results.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  }
}

/* ---- Class-wide PDF (all students, paginated table) ---- */
function generateClassPDF(results){
  if(!window.jspdf){ alert('PDF library did not load. Check your internet connection and try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const maroon = [143,27,27];
  const marginX = 40;
  const colWidths = [25,55,110,90,55,45,40,30,65]; // sums to 515 = pageWidth - 2*marginX
  const headers = ['#','Roll','Name','Enrolment','Class','Score','%','Sw','Submitted'];
  const logoImg = document.querySelector('.header-row img.logo');
  const portraitImg = document.querySelector('.header-row img.portrait');

  function drawLetterhead(){
    try{ if(portraitImg) doc.addImage(portraitImg.src, 'PNG', marginX, 20, 36, 36); }catch(e){}
    try{ if(logoImg) doc.addImage(logoImg.src, 'PNG', pageWidth-marginX-36, 20, 36, 36); }catch(e){}
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...maroon);
    doc.text('Dr. Panjabrao Deshmukh Polytechnic, Amravati', pageWidth/2, 34, {align:'center'});
    doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(30,30,30);
    doc.text('Computer Engineering Department — Industry Internship Test: Class Result Sheet', pageWidth/2, 48, {align:'center'});
    doc.setDrawColor(...maroon); doc.setLineWidth(1); doc.line(marginX, 62, pageWidth-marginX, 62);
  }
  function drawTableHeader(y){
    doc.setFillColor(...maroon);
    doc.rect(marginX, y, colWidths.reduce((a,b)=>a+b,0), 20, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(255,255,255);
    let x = marginX;
    headers.forEach((h,i)=>{ doc.text(h, x+4, y+14); x += colWidths[i]; });
    return y + 20;
  }

  let y = 80;
  drawLetterhead();
  y = drawTableHeader(y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(30,30,30);

  results.forEach((r,idx)=>{
    if(y > pageHeight - 60){
      doc.addPage();
      y = 40;
      drawLetterhead();
      y = drawTableHeader(y);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(30,30,30);
    }
    const totalW = colWidths.reduce((a,b)=>a+b,0);
    if(idx % 2 === 1){
      doc.setFillColor(250,247,238);
      doc.rect(marginX, y, totalW, 18, 'F');
    }
    const rowVals = [String(idx+1), r.roll, r.name, r.enrolment, r.cls||'-', `${r.score}/${r.outOf}`, `${r.percent}%`, String(r.tabSwitches||0), fmtDT(r.submittedAt)];
    let x = marginX;
    rowVals.forEach((val,i)=>{
      const text = doc.splitTextToSize(String(val==null?'':val), colWidths[i]-6)[0] || '';
      doc.text(text, x+4, y+13);
      x += colWidths[i];
    });
    y += 18;
  });

  y += 24;
  if(y > pageHeight - 60){ doc.addPage(); y = 50; drawLetterhead(); y = 90; }
  const total = results.length;
  const passed = results.filter(r=>r.percent>=60).length;
  const flagged = results.filter(r=>(r.tabSwitches||0)>0).length;
  const avg = total ? (results.reduce((s,r)=>s+r.percent,0)/total).toFixed(1) : 0;
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(20,30,60);
  doc.text(`Total Students: ${total}    Passed (≥60%): ${passed}    Average: ${avg}%    Tab-Switch Flags: ${flagged}`, marginX, y);

  doc.save('Class_Results_Industry_Internship_Test.pdf');
}
function exportCSV(results){
  const header = ['Roll','Name','Enrolment','Class','Score','OutOf','Percent','TabSwitches','SubmittedAt'];
  const rows = results.map(r=>[r.roll,r.name,r.enrolment,r.cls||'',r.score,r.outOf,r.percent,r.tabSwitches||0,r.submittedAt]);
  const csv = [header, ...rows].map(row=>row.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'test_results.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- boot ---------- */
async function boot(){
  app.innerHTML = `<div class="card"><div class="loader"><span class="spin"></span>Connecting to Google Sheet… (first load can take a few seconds)</div></div>`;
  if(!isApiConfigured()){
    renderSetupNeeded(null);
    return;
  }
  try{
    await loadAll(); // single request now; throws if the API URL is wrong/unreachable
    renderHome();
  }catch(e){
    renderSetupNeeded(e.message || String(e));
  }
}
boot();
